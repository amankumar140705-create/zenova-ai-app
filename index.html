<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101827">
<title>ZENOVA AI</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
}

header {
    padding: 20px;
    background: #080f1c;
    text-align: center;
}

header h1 { color: #38bdf8; }

main {
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

#chat {
    height: 60vh;
    overflow-y: auto;
    background: #1b293b;
    border-radius: 14px;
    padding: 15px;
}

.message {
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    background: #263950;
    overflow-wrap: anywhere;
}

form {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 0;
    border-radius: 9px;
    font-size: 16px;
}

button {
    padding: 14px;
    border: 0;
    border-radius: 9px;
    background: #0284c7;
    color: white;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>✦ ZENOVA AI</h1>
    <p>Your Personal AI Assistant</p>
</header>

<main>
    <div id="chat" aria-live="polite">
        <div class="message">
            <b>ZENOVA:</b> Hello! Welcome to your AI assistant.
        </div>
    </div>

    <form id="chatForm">
        <input id="message" placeholder="Ask me anything..." required>
        <button type="submit">Send</button>
    </form>
</main>

<script>
let history = [];

const form = document.getElementById("chatForm");
const input = document.getElementById("message");
const chat = document.getElementById("chat");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    const userMessage = document.createElement("div");
    userMessage.className = "message";
    userMessage.textContent = "You: " + text;
    chat.appendChild(userMessage);

    input.value = "";

    history.push({
        role: "user",
        content: text
    });

    const loading = document.createElement("div");
    loading.className = "message";
    loading.textContent = "ZENOVA is thinking...";
    chat.appendChild(loading);

    try {
        const response = await ,fetch(
            "https://zenova-ai-backend.vercel.app/api/chat"
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    messages: history
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "AI connection failed");
        }

        history.push({
            role: "assistant",
            content: data.reply
        });

        loading.textContent = "ZENOVA: " + data.reply;

    } catch (error) {
        console.error(error);
        loading.textContent = "ZENOVA: " + error.message;
        history.pop();
    }

    chat.scrollTop = chat.scrollHeight;
});

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .catch(error => console.log("Service Worker error:", error));
    });
}
</script>

</body>
</html>
